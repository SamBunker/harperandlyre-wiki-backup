name: D1 Backup

on:
  schedule:
    - cron: "0 6 * * *" # daily at 06:00 UTC
  workflow_dispatch: {}

jobs:
  backup:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Export D1 database
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 export harper-lyre-wiki --remote --output=backup.sql

      - name: List R2 image keys
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          curl -sf \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/r2/buckets/harper-lyre-wiki-images/objects" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -o apps/api/r2-keys.json || echo '{"note":"R2 key listing failed or unsupported"}' > apps/api/r2-keys.json

      - name: Commit backup to data-backups branch
        run: |
          DATE=$(date -u +%Y-%m-%d)
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          cp apps/api/backup.sql /tmp/backup.sql
          cp apps/api/r2-keys.json /tmp/r2-keys.json

          git fetch origin data-backups || true
          if git show-ref --verify --quiet refs/remotes/origin/data-backups; then
            git checkout data-backups
          else
            git checkout --orphan data-backups
            git rm -rf . > /dev/null 2>&1 || true
          fi

          mkdir -p backups
          cp /tmp/backup.sql "backups/${DATE}.sql"
          cp /tmp/r2-keys.json "backups/${DATE}-r2-keys.json"

          # Keep the most recent 90 days of backups
          cd backups
          ls -1 -- *.sql 2>/dev/null | sort | head -n -90 | xargs -r rm --
          ls -1 -- *-r2-keys.json 2>/dev/null | sort | head -n -90 | xargs -r rm --
          cd ..

          git add backups
          if ! git diff --cached --quiet; then
            git commit -m "Backup D1 database: ${DATE}"
            git push origin data-backups
          else
            echo "No changes to commit"
          fi

      - name: Notify Discord
        if: always()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          STATUS: ${{ job.status }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "No DISCORD_WEBHOOK_URL secret set, skipping notification"
            exit 0
          fi

          DATE=$(date -u +%Y-%m-%d)
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          if [ "$STATUS" = "success" ]; then
            CONTENT="✅ Wiki backup completed for **${DATE}** — ${RUN_URL}"
          else
            CONTENT="⚠️ Wiki backup **failed** for **${DATE}** — ${RUN_URL}"
          fi

          curl -sf -X POST "$DISCORD_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "{\"content\": \"${CONTENT}\"}"

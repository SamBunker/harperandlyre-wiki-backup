name: D1 Backup

on:
  schedule:
    - cron: "0 6 * * *" # daily at 06:00 UTC
  workflow_dispatch: {}

jobs:
  backup:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Export D1 database
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 export harper-lyre-wiki --remote --output=backup.sql

      - name: Install rclone
        run: sudo apt-get update -y && sudo apt-get install -y rclone

      - name: Download R2 images
        env:
          RCLONE_CONFIG_R2_TYPE: s3
          RCLONE_CONFIG_R2_PROVIDER: Cloudflare
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_R2_ENDPOINT: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
          RCLONE_CONFIG_R2_ACL: private
        run: |
          mkdir -p /tmp/r2-images
          rclone sync r2:harper-lyre-wiki-images /tmp/r2-images --fast-list

      - name: Commit backup to data-backups branch
        run: |
          DATE=$(date -u +%Y-%m-%d)
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          cp apps/api/backup.sql /tmp/backup.sql

          git fetch origin data-backups || true
          if git show-ref --verify --quiet refs/remotes/origin/data-backups; then
            git checkout data-backups
          else
            git checkout --orphan data-backups
            git rm -rf . > /dev/null 2>&1 || true
          fi

          mkdir -p backups
          cp /tmp/backup.sql "backups/${DATE}.sql"

          # Keep the most recent 90 days of SQL dumps
          find backups -maxdepth 1 -name '*.sql' | sort | head -n -90 | xargs -r rm --

          # Images are mirrored (not dated) to avoid unbounded repo growth
          rm -rf backups/images
          mkdir -p backups/images
          cp -r /tmp/r2-images/. backups/images/ 2>/dev/null || true

          git add backups
          if ! git diff --cached --quiet; then
            git commit -m "Backup D1 database: ${DATE}"
            git push origin data-backups
          else
            echo "No changes to commit"
          fi

      - name: Notify Discord
        if: always()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          STATUS: ${{ job.status }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "No DISCORD_WEBHOOK_URL secret set, skipping notification"
            exit 0
          fi

          DATE=$(date -u +%Y-%m-%d)
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          if [ "$STATUS" = "success" ]; then
            DESCRIPTION="✅ Wiki backup completed for **${DATE}** — [View Run](${RUN_URL})"
            COLOR=3447003
          else
            DESCRIPTION="⚠️ Wiki backup **failed** for **${DATE}** — [View Run](${RUN_URL})"
            COLOR=15548997
          fi

          curl -sf -X POST "$DISCORD_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "{\"embeds\": [{\"description\": \"${DESCRIPTION}\", \"color\": ${COLOR}}]}"
